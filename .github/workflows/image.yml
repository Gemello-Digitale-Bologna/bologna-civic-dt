# The app's image (see the Dockerfile), published on GitHub's registry as
# ghcr.io/<owner>/bologna-civic-dt: :<version> for every tag v<version>,
# :<branch> when run by hand (Actions → Image → Run workflow), and always
# :sha-<commit>, which names one build for good. Labelled with the core's
# commit. See docs/deploy-digitalhub.md.
name: Image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: The core's commit
        id: core
        run: |
          commit=$(grep -oP '^civic-engagement = \{ git = "[^"]+", rev = "\K[0-9a-f]+' pyproject.toml || true)
          if [ -z "$commit" ]; then
            echo "pyproject.toml doesn't pin a commit of the core (a local core?)" >&2
            exit 1
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=ref,event=branch
            type=sha
          labels: |
            org.civic-engagement.core=${{ steps.core.outputs.commit }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
